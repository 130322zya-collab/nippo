<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>現場監督日報・段取り | 株式会社濱崎組</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#1c2530;--sub:#6b7785;--faint:#9aa5b1;--line:#e3e7ec;--bg:#f4f6f8;--navy:#1f4e7a;--navyBg:#eef4fa;--amber:#c2710c;--amberBg:#fdf3e3;--green:#2f7d4f;--greenBg:#eaf5ee;--red:#c0392b;--redBg:#fdecea}
body{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:40px}
.wrap{max-width:640px;margin:0 auto;padding:12px}
button{font-family:inherit;cursor:pointer}
button:active{opacity:.7}
.head{background:var(--navy);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.head-title{font-size:18px;font-weight:800;color:#fff}
.head-sub{font-size:11px;color:#a8c4e0;margin-top:2px}
.name-chip{background:#fff;color:var(--navy);border:none;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.links{display:flex;gap:12px;font-size:12px;margin:0 2px 10px}
.links a{color:var(--navy);text-decoration:none;font-weight:700}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;background:#fff;color:var(--sub);border:1.5px solid var(--line);border-radius:10px;padding:10px 0;font-size:13px;font-weight:700}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:#fff;border-radius:14px;padding:14px 15px;margin-bottom:12px;border:1px solid var(--line)}
.card-title{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:10px;display:flex;align-items:center;gap:6px;justify-content:space-between}
label{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.03em;display:block;margin-bottom:4px}
input,textarea,select{width:100%;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);font-family:inherit;resize:none;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--navy);background:#fff}
.field{margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:2fr 2fr 1fr;gap:6px}
.btn{border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700}
.btn-navy{background:var(--navy);color:#fff}
.btn-light{background:var(--navyBg);color:var(--navy)}
.btn-ghost{background:#fff;color:var(--sub);border:1.5px solid var(--line)}
.btn-red{background:var(--redBg);color:var(--red)}
.btn-block{width:100%}
.btn-big{width:100%;padding:15px;font-size:16px;font-weight:800;border-radius:12px}
.small{font-size:11px;color:var(--faint);line-height:1.5}
/* カレンダー */
.monthbar{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:8px}
.mbtn{background:#fff;border:1px solid var(--line);border-radius:10px;width:40px;height:40px;font-size:20px;color:var(--navy)}
.mlabel{font-size:18px;font-weight:800;min-width:120px;text-align:center}
.wrow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wrow div{text-align:center;font-size:11px;font-weight:700;color:var(--faint);padding:2px 0}
.cell{min-height:58px;border-radius:9px;border:1px solid var(--line);background:#fff;padding:3px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.cell .d{font-size:13px;font-weight:600}
.cell.today{border:2px solid var(--navy)}
.cell.sel{background:var(--navyBg)}
.cell .pc{font-size:10px;font-weight:800;color:#fff;background:var(--navy);border-radius:8px;padding:0 5px;line-height:15px}
.cell .ok{font-size:10px;color:var(--green);font-weight:800}
.cell .warn{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--red)}
/* チェックリスト */
.chk-sum{display:block;width:100%;text-align:left;margin-top:8px;background:var(--navyBg);color:var(--navy);border:none;border-radius:8px;padding:8px 10px;font-size:12px;font-weight:700}
.chk-sum.late{background:var(--redBg);color:var(--red)}
.chk-body{margin-top:6px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:8px}
.chk-h{font-size:12px;font-weight:800;color:var(--sub);margin:8px 0 4px}
.chk-h:first-child{margin-top:0}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:5px 0;font-weight:500;color:var(--ink);letter-spacing:0;margin:0}
.chk input{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.chk.on>span{color:var(--faint);text-decoration:line-through}
.rules{margin:0 0 0 18px;font-size:13px;line-height:1.7}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;margin-left:4px;line-height:16px;vertical-align:1px}
.rep-h{display:flex;justify-content:space-between;gap:8px;width:100%;background:none;border:none;text-align:left;font-size:14px;color:var(--ink);padding:0;line-height:1.6}
/* 工程マスタ */
.tpl-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.tpl-name{flex:1;display:flex;justify-content:space-between;align-items:center;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.tpl-mv{width:38px;height:40px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:16px;color:var(--navy)}
.tpl-mv:disabled{opacity:.3}
.mtag{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;vertical-align:1px}
.mt-zairai{background:#eef1f4;color:var(--sub)}
.mt-se{background:#f1ecfb;color:#6b46c1}
/* 年間 */
.ygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ym{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 6px}
.ym-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin-bottom:4px;padding:0 2px;background:none;border:none;width:100%;color:var(--ink)}
.ym-h span{font-size:10px;font-weight:700;color:var(--navy)}
.ym-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.ym-w{font-size:8px;color:var(--faint);text-align:center}
.yd{aspect-ratio:1;border:none;border-radius:4px;font-size:9px;padding:0;background:transparent;color:var(--ink);position:relative}
.yd.l1{background:#dbe7f3}.yd.l2{background:#9fbfdd}.yd.l3{background:var(--navy);color:#fff}
.yd.td{outline:2px solid var(--amber)}
.yd.pd::after{content:"";position:absolute;top:1px;right:1px;width:4px;height:4px;border-radius:50%;background:var(--red)}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--sub)}
/* 手配 */
.plan{border:1px solid var(--line);border-left:4px solid var(--faint);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafbfc}
.plan.st-未連絡{border-left-color:var(--red)}
.plan.st-連絡済{border-left-color:var(--amber)}
.plan.st-確定{border-left-color:var(--green)}
.plan.st-中止{opacity:.55}
.plan.st-中止 .p-main{text-decoration:line-through}
.p-main{font-size:15px;font-weight:700}
.p-sub{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5}
.p-memo{font-size:12px;color:var(--ink);margin-top:4px;white-space:pre-wrap}
.sts{display:flex;gap:4px;margin-top:8px}
.st{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-size:11px;font-weight:700;color:var(--sub)}
.st.on.s-未連絡{background:var(--redBg);border-color:var(--red);color:var(--red)}
.st.on.s-連絡済{background:var(--amberBg);border-color:var(--amber);color:var(--amber)}
.st.on.s-確定{background:var(--greenBg);border-color:var(--green);color:var(--green)}
.st.on.s-中止{background:#eef1f4;border-color:var(--sub);color:var(--sub)}
.p-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.p-acts a,.p-acts button{font-size:12px;font-weight:700;border-radius:8px;padding:6px 9px;text-decoration:none;border:none;white-space:nowrap}
.a-tel{background:var(--greenBg);color:var(--green)}
.a-gcal{background:var(--navyBg);color:var(--navy)}
.a-edit{background:#eef1f4;color:var(--sub)}
.a-del{background:var(--redBg);color:var(--red)}
.site-h{font-size:12px;font-weight:800;color:var(--navy);margin:10px 0 6px}
.date-h{font-size:14px;font-weight:800;margin:14px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.alert{background:var(--redBg);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
.info{background:var(--greenBg);color:var(--green);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
/* 日報 */
.dm-row{display:grid;grid-template-columns:2fr 2fr 1fr 30px;gap:6px;margin-bottom:6px;align-items:center}
.x{background:var(--redBg);color:var(--red);border:none;border-radius:8px;height:34px;font-weight:700}
.miss{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfc}
.miss-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.miss-n{font-size:12px;font-weight:700;color:var(--amber)}
.sev{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.sev-軽微{background:var(--greenBg);color:var(--green)}
.sev-中程度{background:var(--amberBg);color:var(--amber)}
.sev-重大{background:var(--redBg);color:var(--red)}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.daynav .t{font-size:16px;font-weight:800}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:24px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
.center{max-width:380px;margin:40px auto;padding:0 16px}
</style>
</head>

const DEFAULT_ORDER = {
  zairai: ["基礎","プレカット搬入","足場","大工","屋根","サッシ","防蟻","電気","設備","断熱","内装（クロス）","検査・立会い"],
  se:     ["基礎","プレカット搬入","足場","大工","耐力壁","屋根","サッシ","防蟻","電気","設備","断熱","内装（クロス）","検査・立会い"]
};
const REDO = [{max:30,sev:"軽微"},{max:120,sev:"中程度"},{max:Infinity,sev:"重大"}]; // 大工日報と同じ基準
const WD = ["日","月","火","水","木","金","土"];

// ===== 小道具 =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
// 1か月後の同じ日（月末は調整）
const monthLater = s => { const d = pd(s); const t = new Date(d.getFullYear(), d.getMonth()+1, d.getDate()); if(t.getDate() !== d.getDate()) t.setDate(0); return ds(t); };
const today = () => ds(new Date());
const fmtDay = s => { const d = pd(s); return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const uidOf = name => name.replace(/[.#$/\[\]]/g,"_");
const toArr = v => Array.isArray(v) ? v.filter(Boolean) : (v && typeof v === "object" ? Object.values(v) : []);
const sevOf = min => { const v = parseFloat(min); if(!v || v <= 0) return ""; return REDO.find(r => v <= r.max).sev; };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200); }
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

  </div>`;

let started = false;
onAuthStateChanged(auth, u => {
  if(!u){ started = false; renderLogin(); return; }
  if(started) return;
  started = true;
  startData();
});

function startData(){
  $("#app").innerHTML = `<div class="center small">読み込み中…</div>`;
  onValue(ref(db, "kantoku_plans"), snap => {
    S.plans = snap.exists() ? snap.val() : {};
    refreshLists();
    if(S.view !== "report" && !S.planEdit) render(); // 入力中は画面を作り直さない（入力が消えないように）
  }, err => showDbError(err));
  onValue(ref(db, "kantoku_templates"), snap => {
    S.tpls = snap.exists() ? snap.val() : {};
    if(S.view !== "report" && !S.planEdit && S.view !== "master") render();
  }, err => showDbError(err));
  onValue(ref(db, "kantoku_meta/sites"), snap => {
    S.sites = snap.exists() ? snap.val() : {};
    if(S.view === "master" && !S.tplEdit) render();
  });
  onValue(ref(db, "kantoku_meta/tplOrder"), snap => {
    S.tplOrder = snap.exists() ? snap.val() : {};
    fillTradeList("zairai");
    if(S.view === "master" && !S.tplEdit) render();
  });
  onValue(ref(db, "kantoku_meta/names"), async snap => {
    S.names = snap.exists() ? snap.val() : {};
    // 以前の日報に出てくる名前も候補に入れる
    try{
      const r = await get(ref(db, "kantoku_reports"));
      if(r.exists()) Object.entries(r.val()).forEach(([uid, days]) => {
        if(!S.names[uid]){ const first = Object.values(days || {})[0]; S.names[uid] = (first && first.name) || uid; }
      });
    }catch(e){}
    if(S.view === "names" || !S.me) render();
  }, err => showDbError(err));
  watchMyReports();
  if(location.hash === "#reports" && S.me) S.view = "reports";
  render();
}
function showDbError(err){
  $("#app").innerHTML = `<div class="center"><div class="alert">データを読み込めませんでした。<br>${esc(err && err.message)}</div><div class="small">Firebaseのルールに kantoku_plans / kantoku_meta が入っているか確認してください。</div></div>`;
}
function watchMyReports(){
  if(S.unsubReports){ S.unsubReports(); S.unsubReports = null; }
  S.myReports = {};
  if(!S.me) return;
  S.unsubReports = onValue(ref(db, `kantoku_reports/${uidOf(S.me)}`), snap => {
    S.myReports = snap.exists() ? snap.val() : {};
    if((S.view === "cal" || S.view === "day") && !S.planEdit) render();
  });
}

// 入力候補（現場名・業種・業者名）
function refreshLists(){
  const sites = new Set(), comps = new Set(), trades = new Set(TRADES);
  Object.values(S.plans).forEach(p => { if(p.site) sites.add(p.site); if(p.company) comps.add(p.company); if(p.trade) trades.add(p.trade); });
  Object.values(S.myReports).forEach(r => { if(r && r.site) sites.add(r.site); });
  $("#dl-sites").innerHTML = [...sites].map(s => `<option value="${esc(s)}">`).join("");
  $("#dl-companies").innerHTML = [...comps].map(s => `<option value="${esc(s)}">`).join("");
  fillTradeList("zairai");
}

// 手配がその日に入っているか（複数日の手配に対応）
const covers = (p, d) => p.date <= d && d <= (p.dateTo || p.date);
function plansOn(d){
  return Object.entries(S.plans)
    .filter(([,p]) => covers(p, d) && (!S.site || p.site === S.site))
    .sort((a,b) => (a[1].site||"").localeCompare(b[1].site||"") || (a[1].time||"").localeCompare(b[1].time||""));
}
// ===== 工程マスタ（工法ごと） =====
const METHODS = { zairai:"在来工法", se:"SE構法" };
const methodShort = m => m === "se" ? "SE" : "在来";
const siteMethod = site => { const x = site && S.sites[uidOf(site)]; return x ? x.method : ""; };
const methodOf = p => p.method || siteMethod(p.site) || "zairai";
function defaultsOf(method){ return method === "se" ? DEFAULT_TPL_SE : DEFAULT_TPL; }
function savedOf(method, trade){
  const raw = S.tpls || {}, u = uidOf(trade);
  if(raw[method] && raw[method][u]) return raw[method][u];
  if(raw[u] && raw[u].name) return raw[u]; // 以前の保存形式（工法の区別なし）
  return null;
}
function getTpl(trade, method){
  if(!trade) return null;
  method = method || "zairai";
  const saved = savedOf(method, trade);
  if(saved) return { name:trade, materials:toArr(saved.materials), rules:toArr(saved.rules), prep:toArr(saved.prep), custom:true };
  const d = defaultsOf(method)[trade];
  return d ? { name:trade, ...d, custom:false } : null;
}
const tplOf = p => getTpl(p.trade, methodOf(p));
// 工程の並び順（保存されていなければ標準の順＋自社で追加した工程）
function tplList(method){
  const saved = S.tplOrder && S.tplOrder[method];
  if(saved) return toArr(saved);
  const list = [...DEFAULT_ORDER[method]];
  const raw = (S.tpls || {})[method] || {};
  Object.values(raw).forEach(x => { if(x && x.name && !list.includes(x.name)) list.push(x.name); });
  return list;
}
async function saveOrder(method, list){
  try{ await set(ref(db, `kantoku_meta/tplOrder/${method}`), list); }
  catch(e){ alert("並び順の保存に失敗しました：" + e.message); }
}
const doneOf = p => toArr(p.done);
// アラート：事前段取りの期限切れ／3日以内、2日以内の手配で材料未確認
function computeAlerts(){
  const t = today(), soon = addDays(t,3), end = monthLater(t), out = [];
  Object.entries(S.plans).forEach(([id,p]) => {
    if(p.status === "中止" || (S.site && p.site !== S.site)) return;
    if(p.date < t || p.date > end) return;
    const tpl = tplOf(p); if(!tpl) return;
    const done = doneOf(p);
    tpl.prep.forEach(x => {
      if(done.includes("p:"+x.t)) return;
      const due = addDays(p.date, -(Number(x.d)||0));
      if(due < t) out.push({ id, p, lv:"over", due, text:x.t });
      else if(due <= soon) out.push({ id, p, lv:"soon", due, text:x.t });
    });
    if(p.date <= addDays(t,2)){
      const left = tpl.materials.filter(m => !done.includes("m:"+m)).length;
      if(left) out.push({ id, p, lv:"mat", due:p.date, text:`材料の確認が ${left} 件残っています` });
    }
  });
  return out.sort((a,b) => a.due.localeCompare(b.due));
}
function alertBanner(){
  const al = computeAlerts();
  if(!al.length) return "";
  const over = al.filter(a => a.lv === "over").length, rest = al.length - over;
  return `<div class="alert" data-act="view" data-v="upcoming" style="cursor:pointer">⚠ 段取りのアラート：${over ? `期限切れ ${over} 件　` : ""}${rest ? `まもなく・材料 ${rest} 件` : ""} →</div>`;
}
function alertList(){
  const al = computeAlerts();
  if(!al.length) return `<div class="info">✓ 事前の段取り・材料の確認に漏れはありません</div>`;
  return `<div class="card" style="border:2px solid var(--red)">
    <div class="card-title" style="color:var(--red)">⚠ 段取りのアラート（${al.length}件）</div>
    ${al.map(a => `<div style="padding:7px 0;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center">
      <div style="font-size:13px;line-height:1.5"><b style="color:${a.lv==="over"?"var(--red)":"var(--amber)"}">${a.lv==="over"?"期限切れ":a.lv==="soon"?"まもなく":"材料"}</b>　${esc(a.text)}<br>
      <span class="small">${a.lv==="mat"?"":fmtDay(a.due)+"まで／"}${esc(a.p.trade||"")} ${esc(a.p.company||"")}（${fmtDay(a.p.date)}・${esc(a.p.site||"")}）</span></div>
      <button class="btn btn-light" style="padding:5px 10px;font-size:12px;white-space:nowrap" data-act="openchk" data-id="${a.id}">確認</button>
    </div>`).join("")}
  </div>`;
}
// 手配カードの中のチェックリスト
function checkBlock(id, p){
  const m = methodOf(p), tpl = tplOf(p);
  if(!tpl) return p.trade ? `<div class="small" style="margin-top:6px">${METHODS[m]}の「${esc(p.trade)}」は材料・ルールが未登録です　<a href="#" data-act="edittpl" data-t="${esc(p.trade)}" data-m="${m}">登録する</a></div>` : "";
  const done = doneOf(p), t = today();
  const pd2 = tpl.prep.filter(x => done.includes("p:"+x.t)).length, md = tpl.materials.filter(x => done.includes("m:"+x)).length;
  const late = tpl.prep.some(x => !done.includes("p:"+x.t) && addDays(p.date, -(Number(x.d)||0)) < t) && p.date >= t;
  const open = !!S.openChk[id];
  let html = `<button class="chk-sum ${late?"late":""}" data-act="togglechk" data-id="${id}">
    ⏰ 事前段取り ${pd2}/${tpl.prep.length}　📦 材料 ${md}/${tpl.materials.length}　⚠ ルール ${tpl.rules.length}${late?"　<b>期限切れあり</b>":""}<span style="float:right">${open?"▲":"▼"}</span></button>`;
  if(!open) return html;
  const box = (k, label, sub) => `<label class="chk ${done.includes(k)?"on":""}"><input type="checkbox" data-act="chk" data-id="${id}" data-k="${esc(k)}" ${done.includes(k)?"checked":""}><span>${esc(label)}${sub?`<span class="small"> ${sub}</span>`:""}</span></label>`;
  html += `<div class="chk-body"><div class="small" style="margin-bottom:4px">${METHODS[m]}の内容</div>`;
  if(tpl.prep.length) html += `<div class="chk-h">⏰ 事前の段取り</div>` + tpl.prep.map(x => {
    const due = addDays(p.date, -(Number(x.d)||0)), k = "p:"+x.t, over = !done.includes(k) && due < t;
    return box(k, x.t, `<span style="color:${over?"var(--red)":"var(--faint)"}">（${fmtDay(due)}まで${over?"・期限切れ":""}）</span>`);
  }).join("");
  if(tpl.materials.length) html += `<div class="chk-h">📦 必要な材料</div>` + tpl.materials.map(x => box("m:"+x, x)).join("");
  if(tpl.rules.length) html += `<div class="chk-h">⚠ 気を付けるルール</div><ul class="rules">${tpl.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
  html += `<div class="small" style="margin-top:6px">${tpl.custom?"":"※標準の例です。"}<a href="#" data-act="edittpl" data-t="${esc(p.trade)}" data-m="${m}">「${esc(p.trade)}」の内容を直す</a></div></div>`;
  return html;
}
async function toggleCheck(id, k){
  const p = S.plans[id]; if(!p) return;
  const done = doneOf(p), i = done.indexOf(k);
  if(i >= 0) done.splice(i,1); else done.push(k);
  try{ await set(ref(db, `kantoku_plans/${id}/done`), done); }
  catch(e){ alert("保存に失敗しました：" + e.message); }
}

      ${t.custom ? `<button class="btn btn-red" style="flex:1" data-act="resettpl">${defaultsOf(m)[n]?"標準に戻す":"内容を消す"}</button>` : ""}
      <button class="btn btn-navy" style="flex:2" data-act="savetpl">保存</button>
    </div>
    ${inList ? `<button class="btn btn-ghost btn-block" style="margin-top:10px;font-size:13px;color:var(--red)" data-act="tplremove">この工程を一覧から外す</button>` : ""}
  </div>`;
}
function parsePrep(line){
  const m = line.match(/^\s*(\d+)\s*日?\s*前?\s*[:：|｜、,]?\s*(.+)$/);
  return m ? { d:Number(m[1]), t:m[2].trim() } : { d:0, t:line.trim() };
}
async function saveTpl(){
  const m = S.tplMethod || "zairai";
  const lines = id => $(id).value.split("\n").map(x => x.trim()).filter(Boolean);
  const rec = { name:S.tplEdit, materials:lines("#te-mat"), rules:lines("#te-rule"), prep:lines("#te-prep").map(parsePrep), updatedBy:S.me, updatedAt:Date.now() };
  try{
    await set(ref(db, `kantoku_templates/${m}/${uidOf(S.tplEdit)}`), rec);
    const list = tplList(m); if(!list.includes(S.tplEdit)){ list.push(S.tplEdit); await saveOrder(m, list); }
    toast("保存しました"); S.tplEdit = null; if(S.tplFrom){ S.view = S.tplFrom; S.tplFrom = null; } render();
  }catch(e){ alert("保存に失敗しました：" + e.message); }
}
async function setSiteMethod(site, method){
  if(!site) return;
  try{ await set(ref(db, `kantoku_meta/sites/${uidOf(site)}`), { name:site, method }); }
  catch(e){ alert("現場の工法を保存できませんでした：" + e.message); }
}
// 業種の候補（工法ごとの並び順＋手配で使った業種）
function fillTradeList(method){
  const list = [...tplList(method || "zairai")];
  Object.values(S.plans).forEach(p => { if(p.trade && !list.includes(p.trade)) list.push(p.trade); });
  TRADES.forEach(t => { if(!list.includes(t)) list.push(t); });
  $("#dl-trades").innerHTML = list.map(x => `<option value="${esc(x)}">`).join("");
}

function pendingCount(){
  const t = today(), end = monthLater(t);
  return Object.values(S.plans).filter(p => p.status === "未連絡" && (p.dateTo || p.date) >= t && p.date <= end && (!S.site || p.site === S.site)).length;
}
function siteFilter(){
  const sites = [...new Set(Object.values(S.plans).map(p => p.site).filter(Boolean))].sort();
  return `<div class="field"><select data-act="site">
    <option value="">すべての現場</option>
    ${sites.map(s => `<option ${s===S.site?"selected":""}>${esc(s)}</option>`).join("")}
  </select></div>`;
}

// ===== 画面切り替え =====
function render(){
  if(!S.me && S.view !== "names") S.view = "names";
  const v = S.view;
  let body = "";
  if(v === "names") body = viewNames();
  else if(v === "cal") body = viewCal();
  else if(v === "day") body = viewDay();
  else if(v === "upcoming") body = viewUpcoming();
  else if(v === "year") body = viewYear();
  else if(v === "master") body = viewMaster();
  else if(v === "reports") body = viewReports();
  else if(v === "report") return renderReport();
  $("#app").innerHTML = `<div class="wrap">${header()}${v==="names"?"":tabs()}${body}</div>`;
}

// ----- カレンダー -----
function viewCal(){
  const y = S.cursor.getFullYear(), m = S.cursor.getMonth();
  const first = new Date(y,m,1).getDay(), last = new Date(y,m+1,0).getDate();
  let cells = "";
  for(let i=0;i<first;i++) cells += `<div></div>`;
  for(let d=1; d<=last; d++){
    const k = `${y}-${pad(m+1)}-${pad(d)}`;
    const ps = plansOn(k).filter(([,p]) => p.status !== "中止");
    const pending = ps.some(([,p]) => p.status === "未連絡");
    const dow = (first+d-1)%7;
    const col = dow===0 ? "var(--red)" : dow===6 ? "var(--navy)" : "var(--ink)";
    cells += `<button class="cell ${k===today()?"today":""} ${k===S.selDate?"sel":""}" data-act="day" data-d="${k}">
      <span class="d" style="color:${col}">${d}</span>
      ${ps.length ? `<span class="pc">${ps.length}件</span>` : ""}
      ${S.myReports[k] ? `<span class="ok">✓日報</span>` : ""}
      ${pending ? `<span class="warn"></span>` : ""}
    </button>`;
  }
  const n = pendingCount();
  return `
  ${n ? `<div class="alert" data-act="view" data-v="upcoming" style="cursor:pointer">📞 1か月以内に未連絡の手配が ${n} 件あります →</div>` : ""}
  ${alertBanner()}
  ${siteFilter()}
  <div class="card">
    <div class="monthbar">
      <button class="mbtn" data-act="month" data-n="-1">‹</button>
      <div class="mlabel">${y}年${m+1}月</div>
      <button class="mbtn" data-act="month" data-n="1">›</button>
    </div>
    <div class="wrow">${WD.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="grid">${cells}</div>
    <div class="legend"><span><b style="color:var(--navy)">■</b> 手配の件数</span><span><b style="color:var(--green)">✓</b> 日報記入済み</span><span><b style="color:var(--red)">●</b> 未連絡あり</span></div>
  </div>
  <button class="btn btn-navy btn-big" data-act="day" data-d="${today()}">今日の段取り・日報を開く</button>`;
}

async function loadAllReports(){

function viewReports(){
  if(S.allReports === null){ loadAllReports(); return `<div class="card small">読み込み中…</div>`; }
  const mc = S.repMonth || new Date(), y = mc.getFullYear(), m = mc.getMonth(), prefix = `${y}-${pad(m+1)}`;
  const people = Object.entries(S.allReports).map(([uid, days]) => { const f = Object.values(days || {})[0]; return [uid, (f && f.name) || S.names[uid] || uid]; }).sort((a,b) => a[1].localeCompare(b[1]));
  const rows = [];
  Object.entries(S.allReports).forEach(([uid, days]) => {
    if(S.repPerson && uid !== S.repPerson) return;
    Object.entries(days || {}).forEach(([d, r]) => { if(d.startsWith(prefix) && r && (!S.site || r.site === S.site)) rows.push({ uid, d, r }); });
  });
  rows.sort((a,b) => b.d.localeCompare(a.d) || (a.r.name||"").localeCompare(b.r.name||""));
  const missAll = rows.reduce((n,x) => n + toArr(x.r.misses).length, 0);
  const sevN = sv => rows.reduce((n,x) => n + toArr(x.r.misses).filter(z => z.sev === sv).length, 0);
  const card = ({uid, d, r}) => {
    const key = uid + "/" + d, open = !!S.repOpen[key], ms = toArr(r.misses), dm = toArr(r.demen);
    const total = dm.reduce((n,x) => n + (parseFloat(x.count)||0), 0);
    let h = `<div class="plan" style="border-left-color:${ms.length?"var(--amber)":"var(--navy)"}">
      <button class="rep-h" data-act="repopen" data-k="${esc(key)}">
        <span><b>${fmtDay(d)}</b>　${esc(r.name||uid)}<br><span class="small">${esc(r.site||"（現場なし）")}${r.weather?"・"+esc(r.weather):""}${total?`・出面${total}名`:""}</span></span>
        <span style="text-align:right">${ms.length?`<span class="sev sev-${ms.some(z=>z.sev==="重大")?"重大":"中程度"}">ミス${ms.length}</span>`:""} ${open?"▲":"▼"}</span>
      </button>`;
    if(!open) return h + (r.work ? `<div class="p-sub">${esc(r.work.slice(0,60))}${r.work.length>60?"…":""}</div>` : "") + `</div>`;
    const sec = (t, v) => v ? `<div class="chk-h">${t}</div><div class="p-memo">${esc(v)}</div>` : "";
    h += `<div class="chk-body">`;
    if(dm.length) h += `<div class="chk-h">👷 出面</div>` + dm.map(x => `<div class="p-sub">・${esc(x.trade)} ${esc(x.company)} ${x.count!==""?esc(x.count)+"名":""}</div>`).join("");
    h += sec("🏗️ 現場の様子", r.work) + sec("🦺 安全・検査・打合せ", r.anzen);
    if(ms.length) h += `<div class="chk-h">⚠️ ミス・問題</div>` + ms.map(z => `<div style="margin:4px 0;padding:6px 8px;background:#fafbfc;border-radius:8px">
      <div style="font-size:13px">${z.sev?`<span class="sev sev-${esc(z.sev)}">${esc(z.sev)}</span> `:""}${z.big?`<span class="small">${esc(z.big)}</span> `:""}${esc(z.text)}</div>
      ${z.cause?`<div class="p-sub">原因：${esc(z.cause)}</div>`:""}${z.taisaku?`<div class="p-sub" style="color:var(--green)">対策：${esc(z.taisaku)}</div>`:""}${z.redo?`<div class="p-sub">対応時間：${esc(z.redo)}分</div>`:""}
    </div>`).join("");
    h += sec("💡 学び・気づき", r.learn) + sec("🎯 申し送り", r.next);
    if((r.name || "") === S.me) h += `<button class="btn btn-light btn-block" style="margin-top:8px" data-act="repedit" data-d="${d}">自分の日報なので開いて直す</button>`;
    return h + `</div></div>`;
  };
  return `
  <div class="monthbar">
    <button class="mbtn" data-act="repmonth" data-n="-1">‹</button>
    <div class="mlabel">${y}年${m+1}月</div>
    <button class="mbtn" data-act="repmonth" data-n="1">›</button>
  </div>
  <div class="row2">
    <div class="field"><select data-act="repperson"><option value="">監督：全員</option>${people.map(([u,n]) => `<option value="${esc(u)}" ${u===S.repPerson?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
    ${siteFilter()}
  </div>
  <div class="card" style="display:flex;justify-content:space-around;text-align:center;padding:10px">
    <div><div style="font-size:20px;font-weight:800;color:var(--navy)">${rows.length}</div><div class="small">日報</div></div>
    <div><div style="font-size:20px;font-weight:800;color:var(--amber)">${missAll}</div><div class="small">ミス</div></div>
    <div><div style="font-size:20px;font-weight:800;color:var(--red)">${sevN("重大")}</div><div class="small">重大</div></div>
    <div><button class="btn btn-light" style="padding:6px 10px;font-size:12px" data-act="repreload">更新</button></div>
  </div>
  ${rows.length ? rows.map(card).join("") : `<div class="card small">この月の日報はありません。</div>`}`;
}

// ----- 年間カレンダー -----
function viewYear(){
  const y = S.year || S.cursor.getFullYear();
  const from = `${y}-01-01`, to = `${y}-12-31`;
  const map = {}; // 日付 -> {n, pending}
  Object.values(S.plans).forEach(p => {
    if(p.status === "中止" || (S.site && p.site !== S.site)) return;
    const end = p.dateTo || p.date;
    if(end < from || p.date > to) return;
    let d = p.date < from ? from : p.date;
    const last = end > to ? to : end;
    for(let i = 0; d <= last && i < 400; d = addDays(d,1), i++){
      const o = map[d] = map[d] || { n:0, pending:false };
      o.n++; if(p.status === "未連絡") o.pending = true;
    }
  });
  const t = today();
  let months = "";
  for(let m = 0; m < 12; m++){
    const first = new Date(y,m,1).getDay(), last = new Date(y,m+1,0).getDate();
    let cells = "", total = 0;
    for(let i=0;i<first;i++) cells += `<span></span>`;
    for(let d=1; d<=last; d++){
      const k = `${y}-${pad(m+1)}-${pad(d)}`, o = map[k];
      const lv = !o ? "" : o.n >= 4 ? "l3" : o.n >= 2 ? "l2" : "l1";
      if(o) total++;
      cells += `<button class="yd ${lv} ${k===t?"td":""} ${o&&o.pending?"pd":""}" data-act="day" data-d="${k}">${d}</button>`;
    }
    months += `<div class="ym">
      <button class="ym-h" data-act="openmonth" data-m="${m}">${m+1}月${total ? `<span>手配${total}日</span>` : ""}</button>
      <div class="ym-g">${WD.map(w=>`<span class="ym-w">${w}</span>`).join("")}${cells}</div>
    </div>`;
  }
  return `
  ${siteFilter()}
  <div class="monthbar">
    <button class="mbtn" data-act="year" data-n="-1">‹</button>
    <div class="mlabel">${y}年</div>
    <button class="mbtn" data-act="year" data-n="1">›</button>
  </div>
  <div class="ygrid">${months}</div>
  <div class="legend">
    <span><b style="color:#9fbfdd">■</b> 手配あり（濃いほど多い）</span>
    <span><b style="color:var(--red)">●</b> 未連絡あり</span>
    <span><b style="color:var(--amber)">□</b> 今日</span>
  </div>
  <div class="small" style="text-align:center;margin-top:6px">日付をタップでその日、月の名前をタップで月のカレンダーを開きます</div>`;
}

// ----- 今後の段取り -----
function viewUpcoming(){
  const t = today();
  const days = [];
  const end = monthLater(t);
  for(let d = t; d <= end; d = addDays(d,1)) days.push(d);
  const n = pendingCount();
  let html = `<div class="small" style="margin:0 2px 8px">今日から1か月後（${fmtDay(end)}）までの手配</div>`;
  html += n ? `<div class="alert">📞 未連絡が ${n} 件あります。早めに連絡を。</div>` : `<div class="info">✓ 1か月以内の手配はすべて連絡済みです</div>`;
  html += alertList();
  html += siteFilter();
  html += `<div style="display:flex;gap:6px;margin-bottom:10px">
    <button class="btn ${S.onlyPending?"btn-ghost":"btn-navy"}" style="flex:1" data-act="pendfilter" data-v="0">すべて</button>
    <button class="btn ${S.onlyPending?"btn-navy":"btn-ghost"}" style="flex:1" data-act="pendfilter" data-v="1">未連絡だけ</button>
    <button class="btn btn-light" style="flex:1" data-act="share" data-scope="upcoming">📤 共有</button>
  </div>`;
  let any = false;
  days.forEach(d => {
    const ps = plansOn(d).filter(([,p]) => (p.date === d || d === t) && (!S.onlyPending || p.status === "未連絡")); // 複数日の手配は初日（または今日）にだけ表示
    if(!ps.length) return;
    any = true;
    html += `<div class="date-h"><span>${fmtDay(d)}${d===t?"　今日":""}</span><button class="btn btn-light" style="padding:5px 10px;font-size:12px" data-act="day" data-d="${d}">この日を開く</button></div>`;
    html += ps.map(([id,p]) => planCard(id,p,true)).join("");
  });
  if(!any) html += `<div class="card small">${S.onlyPending ? "未連絡の手配はありません。" : "これから1か月の手配はありません。カレンダーの日付から追加できます。"}</div>`;
  return html;
}

// ===== 段取りを文章にして共有（LINEなど） =====
function planLine(p){
  return `・${p.trade||""}${p.company?" "+p.company:""}${p.count?" "+p.count+"名":""}${p.time?" "+p.time:""}${p.site?"（"+p.site+"）":""}【${p.status||"未連絡"}】${p.memo?"\n　"+p.memo.replace(/\n/g," "):""}`;
}
async function sharePlans(scope){
  let text = "";
  if(scope === "day"){
    const ps = plansOn(S.selDate).filter(([,p]) => p.status !== "中止");
    text = `【${fmtDay(S.selDate)}の段取り】${S.site?"\n現場："+S.site:""}\n` + ps.map(([,p]) => planLine(p)).join("\n");
    const rules = [];
    ps.forEach(([,p]) => { const t = tplOf(p); if(t && t.rules.length) rules.push(`＜${p.trade}＞\n` + t.rules.map(r => "・" + r).join("\n")); });
    if(rules.length) text += "\n\n【気を付けること】\n" + [...new Set(rules)].join("\n");
  }else{
    const t = today(), end = monthLater(t);
    text = `【今後の段取り ${fmtDay(t)}〜${fmtDay(end)}】${S.site?"\n現場："+S.site:""}`;
    for(let d = t; d <= end; d = addDays(d,1)){
      const ps = plansOn(d).filter(([,p]) => (p.date === d || d === t) && p.status !== "中止" && (!S.onlyPending || p.status === "未連絡"));
      if(ps.length) text += `\n\n■ ${fmtDay(d)}\n` + ps.map(([,p]) => planLine(p) + (p.dateTo && p.dateTo !== p.date ? `　〜${fmtDay(p.dateTo)}` : "")).join("\n");
    }
  }
  try{
    if(navigator.share){ await navigator.share({ text }); return; }
  }catch(e){ if(e && e.name === "AbortError") return; }
  try{ await navigator.clipboard.writeText(text); toast("コピーしました。LINEなどに貼り付けてください"); }
  catch(e){ prompt("この文章をコピーしてください", text); }
}

async function savePlan(){
  const g = id => $(id).value.trim();
  const p = {
    date: g("#pf-date"), dateTo: g("#pf-dateTo"), site: g("#pf-site"), trade: g("#pf-trade"),
    company: g("#pf-company"), count: g("#pf-count"), time: g("#pf-time"), contact: g("#pf-contact"),
    memo: g("#pf-memo"), status: $("#pf-status").value, method: $("#pf-method").value, updatedBy: S.me, updatedAt: Date.now()
  };
  if(!p.date){ alert("開始日を入れてください"); return; }
  if(!p.trade && !p.company){ alert("業種か業者名のどちらかは入れてください"); return; }
  if(p.dateTo && p.dateTo < p.date){ alert("終了日が開始日より前になっています"); return; }
  if(p.dateTo === p.date) p.dateTo = "";
  try{
    if(S.planEdit === "new"){ p.createdBy = S.me; p.createdAt = Date.now(); await push(ref(db, "kantoku_plans"), p); }
    else { const old = S.plans[S.planEdit] || {}; await set(ref(db, `kantoku_plans/${S.planEdit}`), { ...old, ...p }); }
    if(p.site) lsSet("kantoku_last_site", p.site);
    lsSet("kantoku_last_method", p.method);
    if(p.site && siteMethod(p.site) !== p.method) await setSiteMethod(p.site, p.method);
    S.planEdit = null; S.planCopy = null; toast("手配を保存しました"); render();
  }catch(e){ alert("保存に失敗しました：" + e.message); }
}
async function setStatus(id, s){
  const p = S.plans[id]; if(!p) return;
  try{ await set(ref(db, `kantoku_plans/${id}`), { ...p, status:s, updatedBy:S.me, updatedAt:Date.now() }); toast(`「${s}」にしました`); }
  catch(e){ alert("更新に失敗しました：" + e.message); }
}
async function delPlan(id){
  const p = S.plans[id]; if(!p) return;
  if(!confirm(`${p.trade||""} ${p.company||""}（${fmtDay(p.date)}）の手配を削除しますか？`)) return;
  try{ await remove(ref(db, `kantoku_plans/${id}`)); toast("削除しました"); }
  catch(e){ alert("削除に失敗しました：" + e.message); }
}

function normalize(r){

async function saveReport(){
  const r = S.report;
  const half = r.misses.filter(m => !m.text.trim() && (m.big || m.cause.trim() || m.redo || m.taisaku.trim()));
  if(half.length && !confirm(`「内容」が空のミスが ${half.length} 件あります。内容が空のものは保存されません。このまま保存しますか？`)) return;
  const record = {
    name: S.me,
    site: r.site.trim(), weather: r.weather, work: r.work.trim(), anzen: r.anzen.trim(),
    demen: r.demen.filter(x => x.trade.trim() || x.company.trim()).map(x => ({ trade:x.trade.trim(), company:x.company.trim(), count: x.count === "" ? "" : Number(x.count) })),
    misses: r.misses.filter(m => m.text.trim()).map(m => ({ big:m.big, text:m.text.trim(), cause:m.cause.trim(), redo: m.redo ? Number(m.redo) : 0, sev: sevOf(m.redo), taisaku:m.taisaku.trim() })),
    learn: r.learn.trim(), next: r.next.trim(), savedAt: Date.now()
  };
  const b = $("#save-rep"); b.disabled = true; b.textContent = "保存中…";
  try{

}

    S.tplEdit = null; S.tplFrom = null; render();
  }
  else if(a === "tplcopy"){
    const ot = getTpl(S.tplEdit, S.tplMethod === "se" ? "zairai" : "se"); if(!ot) return;
    $("#te-mat").value = ot.materials.join("\n"); $("#te-rule").value = ot.rules.join("\n"); $("#te-prep").value = ot.prep.map(x => `${x.d}日前：${x.t}`).join("\n");
    toast("コピーしました。直してから保存してください");
  }
  else if(a === "sitemethod"){ await setSiteMethod(el.dataset.s, el.dataset.m); toast(`${el.dataset.s}を${METHODS[el.dataset.m]}にしました`); }
  else if(a === "tplback"){ S.tplEdit = null; if(S.tplFrom){ S.view = S.tplFrom; S.tplFrom = null; } render(); }
  else if(a === "savetpl"){ await saveTpl(); }
  else if(a === "resettpl"){ if(!confirm(`「${S.tplEdit}」の登録内容を消しますか？`)) return; try{ await remove(ref(db, `kantoku_templates/${S.tplMethod}/${uidOf(S.tplEdit)}`)); const u = uidOf(S.tplEdit); if(S.tpls[u] && S.tpls[u].name) await remove(ref(db, `kantoku_templates/${u}`)); S.tplEdit = null; toast("消しました"); render(); }catch(err){ alert("失敗しました：" + err.message); } }
  else if(a === "togglechk"){ S.openChk[el.dataset.id] = !S.openChk[el.dataset.id]; render(); }
  else if(a === "chk"){ await toggleCheck(el.dataset.id, el.dataset.k); }
  else if(a === "openchk"){ const p = S.plans[el.dataset.id]; if(!p) return; S.openChk[el.dataset.id] = true; S.selDate = p.date; S.cursor = pd(p.date); S.view = "day"; render(); window.scrollTo(0,0); }
  else if(a === "pendfilter"){ S.onlyPending = el.dataset.v === "1"; render(); }
  else if(a === "share"){ await sharePlans(el.dataset.scope); }
  else if(a === "saveplan"){ await savePlan(); }
  else if(a === "status"){ await setStatus(el.dataset.id, el.dataset.s); }
  else if(a === "delplan"){ await delPlan(el.dataset.id); }
  else if(a === "report"){ await openReport(); window.scrollTo(0,0); }
  else if(a === "repback"){ if(S.reportDirty && !confirm("保存していない内容は下書きとして端末に残ります。戻りますか？")) return; S.view = "day"; render(); }
  else if(a === "saverep"){ await saveReport(); }
  else if(a === "dmadd"){ S.report.demen.push({trade:"",company:"",count:""}); saveDraft(); renderReport(); }
  else if(a === "dmdel"){ S.report.demen.splice(Number(el.dataset.i),1); saveDraft(); renderReport(); }
  else if(a === "dmplan"){
    const add = demenFromPlans();
    if(!add.length){ toast("この日の手配がありません"); return; }
    if(S.report.demen.length && !confirm("今の出面を、手配の内容で置き換えますか？")) return;
    S.report.demen = add; saveDraft(); renderReport();
  }
  else if(a === "madd"){ S.report.misses.push({big:"",text:"",cause:"",redo:"",taisaku:"",sev:""}); saveDraft(); renderReport(); }
  else if(a === "mdel"){ if(!confirm("このミスを消しますか？")) return; S.report.misses.splice(Number(el.dataset.i),1); saveDraft(); renderReport(); }
});

window.addEventListener("hashchange", () => { if(location.hash === "#reports" && S.me && started && S.view !== "report"){ S.view = "reports"; S.allReports = null; render(); } });
// 画面を閉じるとき、未保存なら警告（下書きは残る）
window.addEventListener("beforeunload", e => { if(S.view === "report" && S.reportDirty){ e.preventDefault(); e.returnValue = ""; } });
</script>
</body>
</html>
